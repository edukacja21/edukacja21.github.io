<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Aktualności – Edukacja21</title>
</head>

<body>

  <h1>Aktualności</h1>

  <div id="aktualnosci"></div>

  <script>
    fetch("news.json")
      .then(response => response.json())
      .then(news => {

        const miejsce = document.getElementById("aktualnosci");

        news.forEach(wpis => {
          miejsce.innerHTML += `
            <article>
              <h2>${wpis.title}</h2>
              <h3>${wpis.date}</h3>
              <h3>${wpis.time}</h3>
              <p>${wpis.content}</p>
            </article>
          `;
        });

      });
  </script>

</body>
</html>
